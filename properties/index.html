<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Properties | Atela Homes</title>
    <meta
      name="description"
      content="Available properties in Madrid selected by Atela Homes for sale and rent."
    />
    <link rel="icon" type="image/svg+xml" href="../assets/logo-favicon.svg" />
    <link rel="stylesheet" href="../styles.css?v=53" />
  </head>
  <body class="subpage properties-page" data-page="properties">
    <header class="site-header" data-header>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-toggle>
        <span></span>
        <span></span>
        <span class="sr-only">Menu</span>
      </button>

      <a class="brand" href="../index.html#home" aria-label="Atela Homes home">
        <img class="brand-logo" src="../assets/logo-horizontal.svg" alt="Atela Homes" />
      </a>

      <nav class="site-nav" id="site-nav" data-nav>
        <a class="nav-anchor" href="../index.html#method" data-i18n="navMethod">Método</a>
        <a class="nav-anchor" href="../index.html#areas" data-i18n="navAreas">Zonas</a>
        <a class="nav-page" href="./" data-i18n="navProperties" aria-current="page">Propiedades</a>
        <a class="nav-anchor" href="../index.html#homes" data-i18n="navHomes">Rutas</a>
        <a class="nav-page" href="../equipo/" data-i18n="navTeam">Equipo</a>
        <a class="nav-anchor" href="../index.html#contact" data-i18n="navContact">Contacto</a>
        <div class="language-switch" aria-label="Language selector">
          <button type="button" data-lang="es">ES</button>
          <button class="active" type="button" data-lang="en">EN</button>
        </div>
      </nav>
    </header>

    <main class="properties-main" id="home">
      <section class="properties editorial-section">
        <div class="section-label">
          <span data-i18n="propertiesLabel">Propiedades</span>
        </div>
        <div class="properties-heading">
          <h1 data-i18n="propertiesTitle">Una selección de propiedades disponibles.</h1>
          <p data-i18n="propertiesIntro">Explora cada propiedad y consulta sus detalles, galería y disponibilidad.</p>
        </div>
        <section class="property-filters" aria-label="Filtros de propiedades" data-property-filters>
          <div class="property-filter-group">
            <p class="property-filter-label" data-filter-operation-label>Tipo de operación</p>
            <div class="property-filter-modes" role="group" aria-label="Tipo de operación">
              <button class="active" type="button" data-filter-status="all" aria-pressed="true">Todas</button>
              <button type="button" data-filter-status="sale" aria-pressed="false">En venta</button>
              <button type="button" data-filter-status="rent" aria-pressed="false">En alquiler</button>
            </div>
          </div>
          <p class="property-result-count" aria-live="polite" data-property-count></p>
        </section>
        <div class="property-grid" data-property-grid></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-brand">
        <img class="footer-logo" src="../assets/logo-stacked.svg" alt="Atela Homes" />
        <p>© <span data-year></span> Atela Homes</p>
      </div>
      <div class="footer-legal-links">
        <a href="../aviso-legal/" data-i18n="footerLegal">Aviso Legal</a>
        <a href="../politica-de-privacidad/" data-i18n="footerPrivacy">Política de Privacidad</a>
        <a href="../politica-de-cookies/" data-i18n="footerCookies">Política de Cookies</a>
      </div>
      <a href="#home" class="footer-top" data-i18n="footerTop">Volver arriba</a>
    </footer>

    <script src="./property-data.js?v=49"></script>
    <script src="../script.js?v=48"></script>
    <script src="./properties-list.js?v=53"></script>
  </body>
</html>
